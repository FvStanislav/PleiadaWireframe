<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pleiada Wireframe</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="split.css">
  <link rel="stylesheet" href="management.css">
  <link rel="stylesheet" href="campaign-list.css">
  <link rel="stylesheet" href="publisher.css">
</head>
<body>
  <header class="topbar">
    <div>
      <strong>Pleiada</strong>
      <span class="muted">wireframe</span>
    </div>
    <button class="workspace-switch" id="workspace-switch" type="button">Кабинет паблишера</button>
    <span class="version" id="version">v0.1.0</span>
  </header>

  <main class="shell">
    <aside class="sidebar">
      <div class="account-card">
        <div class="account-avatar">FV</div>
        <div class="account-main">
          <div class="account-name" id="account-name"></div>
          <div class="account-balance-label">Баланс</div>
          <div class="account-balance" id="account-balance"></div>
        </div>
      </div>

      <div class="sidebar-title">Разделы</div>

      <button class="nav-item active" data-screen="campaigns">
        <span class="nav-title">Рекламные кампании</span>
        <span class="nav-description">Основной список РК</span>
      </button>

      <button class="nav-item" data-screen="reports">
        <span class="nav-title">Отчеты</span>
        <span class="nav-description">Формирование кастомных отчетов</span>
      </button>

      <button class="nav-item" data-screen="profile">
        <span class="nav-title">Профиль и организации</span>
        <span class="nav-description">Личные данные и данные юридических лиц</span>
      </button>

      <button class="nav-item" data-screen="billing">
        <span class="nav-title">Платежи и документы</span>
        <span class="nav-description">Юридические документы и расчеты</span>
      </button>

      <button class="nav-item" data-screen="help">
        <span class="nav-title">Помощь</span>
        <span class="nav-description">Документация и поддержка</span>
      </button>
    </aside>

    <section class="content" id="screen"></section>
  </main>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
  <script src="split.js"></script>
  <script src="management.js"></script>
  <script src="creative-library.js"></script>
  <script src="campaign-list.js"></script>
  <script src="publisher.js"></script>
</body>
</html>
